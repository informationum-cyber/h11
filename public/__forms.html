<!DOCTYPE html>
<html>
  <body>
    <!-- This file exists only so Netlify registers the form at build time. It is never shown to users. -->
    <form name="quiz-results" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="text" name="examTitle" />
      <input type="text" name="studentName" />
      <input type="text" name="takenAt" />
      <input type="text" name="score" />
      <input type="text" name="scorePercent" />
      <textarea name="domainBreakdown"></textarea>
      <textarea name="missedQuestions"></textarea>
    </form>

    <form name="contractor-onboarding" netlify netlify-honeypot="bot-field" enctype="multipart/form-data" hidden>
      <input type="text" name="bot-field" />
      <input type="text" name="submittedAt" />
      <input type="text" name="fullName" />
      <input type="text" name="dateOfBirth" />
      <input type="text" name="sinConsent" />
      <input type="text" name="sin" />
      <input type="text" name="photoConsent" />
      <input type="text" name="termsRead" />
      <input type="text" name="idType" />
      <input type="text" name="declareTrue" />
      <input type="file" name="photo" />
      <input type="file" name="idDocument" />
    </form>
  </body>
</html>
